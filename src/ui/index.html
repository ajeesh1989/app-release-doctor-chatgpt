<body>
  <main class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">🩺</div>

        <div>
          <h1>App Release Doctor</h1>
          <p class="subtitle">
            Smart Flutter Android release diagnostics
          </p>
        </div>
      </div>
    </header>

    <section class="card">

      <div class="card-title">
        Release diagnostics
      </div>

      <div class="card-description">
        Inspect your Android release, check Flutter configuration,
        verify Target SDK requirements, and review Google Play readiness.
      </div>

      <div class="actions">

        <button
          class="primary"
          data-action="inspect_aab"
        >
          <span class="button-title">
            Inspect AAB
          </span>

          <span class="button-description">
            Analyze your Android App Bundle
          </span>
        </button>

        <button
          data-action="check_flutter_project"
        >
          <span class="button-title">
            Check Flutter Project
          </span>

          <span class="button-description">
            Inspect Flutter release configuration
          </span>
        </button>

        <button
          data-action="check_target_sdk"
        >
          <span class="button-title">
            Check Target SDK
          </span>

          <span class="button-description">
            Verify Android SDK compliance
          </span>
        </button>

        <button
          data-action="check_play_store_readiness"
        >
          <span class="button-title">
            Play Store Readiness
          </span>

          <span class="button-description">
            Check release readiness
          </span>
        </button>

      </div>

      <div
        id="result"
        class="result"
      >
        <div class="result-title">
          Result
        </div>

        <div id="resultContent"></div>
      </div>

    </section>

    <section class="card">

      <div class="status">
        <span
          id="statusDot"
          class="status-dot"
        ></span>

        <span id="statusText">
          Connecting to App Release Doctor...
        </span>
      </div>

    </section>

  </main>

  <script type="module">

    /*
     * MCP Apps View
     *
     * Communication with the MCP Apps host uses
     * JSON-RPC messages over window.postMessage().
     */

    let nextRequestId = 1;

    const pendingRequests = new Map();

    const statusText =
      document.getElementById("statusText");

    const statusDot =
      document.getElementById("statusDot");

    const result =
      document.getElementById("result");

    const resultContent =
      document.getElementById("resultContent");


    function setStatus(
      text,
      state = "connecting"
    ) {
      statusText.textContent = text;

      statusDot.className =
        "status-dot";

      if (state === "connected") {
        statusDot.classList.add("connected");
      }

      if (state === "error") {
        statusDot.classList.add("error");
      }
    }


    function showResult(value) {
      result.classList.add("visible");

      if (typeof value === "string") {
        resultContent.textContent = value;
        return;
      }

      resultContent.textContent =
        JSON.stringify(value, null, 2);
    }


    function sendRequest(
      method,
      params = {}
    ) {
      return new Promise(
        (resolve, reject) => {

          const id = nextRequestId++;

          pendingRequests.set(
            id,
            {
              resolve,
              reject
            }
          );

          window.parent.postMessage(
            {
              jsonrpc: "2.0",
              id,
              method,
              params
            },
            "*"
          );
        }
      );
    }


    function sendNotification(
      method,
      params = {}
    ) {
      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method,
          params
        },
        "*"
      );
    }


    function displayToolResult(
      toolResult
    ) {
      if (!toolResult) {
        showResult("No result returned.");
        return;
      }

      if (
        toolResult.structuredContent
      ) {
        showResult(
          toolResult.structuredContent
        );
        return;
      }

      if (
        Array.isArray(
          toolResult.content
        )
      ) {
        const textParts =
          toolResult.content
            .filter(
              (item) =>
                item &&
                item.type === "text"
            )
            .map(
              (item) =>
                item.text
            );

        if (textParts.length > 0) {
          showResult(
            textParts.join("\n")
          );
          return;
        }
      }

      showResult(toolResult);
    }


    window.addEventListener(
      "message",
      (event) => {

        const message =
          event.data;

        if (!message) {
          return;
        }


        /*
         * JSON-RPC response
         */

        if (
          message.jsonrpc === "2.0" &&
          message.id !== undefined
        ) {
          const pending =
            pendingRequests.get(
              message.id
            );

          if (!pending) {
            return;
          }

          pendingRequests.delete(
            message.id
          );

          if (message.error) {
            pending.reject(
              new Error(
                message.error.message ||
                "MCP request failed"
              )
            );
          } else {
            pending.resolve(
              message.result
            );
          }

          return;
        }


        /*
         * Host notification:
         * tool result
         */

        if (
          message.method ===
          "ui/notifications/tool-result"
        ) {
          displayToolResult(
            message.params
          );
        }


        /*
         * Host notification:
         * tool input
         */

        if (
          message.method ===
          "ui/notifications/tool-input"
        ) {
          console.log(
            "Tool input:",
            message.params
          );
        }

      }
    );


    async function initialize() {

      try {

        /*
         * MCP Apps initialization.
         */

        await sendRequest(
          "ui/initialize",
          {
            protocolVersion:
              "2025-11-25",

            clientInfo: {
              name:
                "App Release Doctor",

              version:
                "1.0.0"
            },

            capabilities: {}
          }
        );


        /*
         * Tell the host that
         * the UI is ready.
         */

        sendNotification(
          "ui/notifications/initialized",
          {}
        );


        setStatus(
          "Connected to App Release Doctor",
          "connected"
        );


      } catch (error) {

        console.error(
          "Initialization failed:",
          error
        );

        setStatus(
          "Waiting for ChatGPT connection",
          "error"
        );

      }
    }


    async function runAction(
      action
    ) {

      const buttons =
        document.querySelectorAll(
          "[data-action]"
        );

      buttons.forEach(
        (button) => {
          button.disabled = true;
        }
      );


      showResult(
        "Running " +
        action.replaceAll("_", " ") +
        "..."
      );


      try {

        const toolResult =
          await sendRequest(
            "tools/call",
            {
              name:
                "app_release_doctor",

              arguments: {
                action
              }
            }
          );


        displayToolResult(
          toolResult
        );


      } catch (error) {

        console.error(
          "Tool call failed:",
          error
        );

        showResult(
          error.message ||
          "Unable to run App Release Doctor."
        );

      } finally {

        buttons.forEach(
          (button) => {
            button.disabled = false;
          }
        );

      }
    }


    document
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            () => {

              const action =
                button.dataset.action;

              if (!action) {
                return;
              }

              runAction(action);
            }
          );

        }
      );


    /*
     * Start MCP Apps handshake.
     */

    initialize();

  </script>
</body>
</html>
