```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>App Release Doctor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 32px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      max-width: 600px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tool {
      appearance: none;
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: white;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .tool:hover {
      transform: translateY(-1px);
      border-color: #cbd5e1;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }

    .tool:active {
      transform: translateY(0);
    }

    .tool-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: #f1f5f9;
      font-size: 19px;
      margin-bottom: 14px;
    }

    .tool-title {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 650;
      color: #0f172a;
    }

    .tool-description {
      display: block;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
    }

    @media (max-width: 560px) {
      .app {
        padding: 22px 16px 28px;
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="logo">🩺</div>

      <div class="brand">
        <h1>App Release Doctor</h1>
        <p>Flutter release health &amp; Play Store readiness</p>
      </div>
    </header>

    <section class="hero">
      <h2>What would you like to check?</h2>

      <p>
        Inspect your Flutter release, identify potential problems,
        and prepare your app for Google Play.
      </p>
    </section>

    <section class="tools">

      <button class="tool" data-tool="inspect_aab">
        <span class="tool-icon">📦</span>
        <span class="tool-title">Inspect AAB</span>
        <span class="tool-description">
          Analyze your Android App Bundle for release problems,
          risks, and optimization opportunities.
        </span>
      </button>

      <button class="tool" data-tool="check_flutter_project">
        <span class="tool-icon">🩺</span>
        <span class="tool-title">Check Flutter Project</span>
        <span class="tool-description">
          Check Flutter configuration, versioning, signing,
          and release readiness.
        </span>
      </button>

      <button class="tool" data-tool="check_target_sdk">
        <span class="tool-icon">🎯</span>
        <span class="tool-title">Check Target SDK</span>
        <span class="tool-description">
          Verify your Android target SDK against current
          Google Play requirements.
        </span>
      </button>

      <button class="tool" data-tool="check_play_store_readiness">
        <span class="tool-icon">🚀</span>
        <span class="tool-title">Play Store Readiness</span>
        <span class="tool-description">
          Run a release-readiness check before uploading
          your app to Google Play.
        </span>
      </button>

    </section>

    <footer class="footer">
      App Release Doctor · Built for Flutter developers
    </footer>

  </main>

  <script>
    document.querySelectorAll(".tool").forEach((button) => {
      button.addEventListener("click", () => {
        const tool = button.dataset.tool;

        window.parent.postMessage(
          {
            type: "app-release-doctor-tool",
            tool,
          },
          "*"
        );
      });
    });
  </script>
</body>
</html>
```
